name: "Release"

on: workflow_dispatch
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g pnpm@12.21.0
      # conventionalcommits v10はrelease notesが空になるバグがあるため9.3.1に固定
      # https://github.com/semantic-release/release-notes-generator/issues/992
      - run: |
          pnpm dlx \
             --package semantic-release@25.0.9 \
             --package conventional-changelog-conventionalcommits@9.3.1 \
             --package @semantic-release/git@11.0.1 \
             --package @semantic-release/exec@7.1.0 \
              semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
